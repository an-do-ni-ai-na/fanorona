<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanorona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================================================
   Charte graphique — voir tools/gui/CHARTE.md.
   Trois thèmes : Papier (clair), Ardoise (sombre), Veille (nuit : chaud, sans bleu vif, luminosité réduite).
   « auto » suit le système (Papier/Ardoise) ; Veille est toujours un choix explicite (ou l'horaire nocturne).
   Deux plateaux : bois (pièces ivoire/ébène) et granite (galets quartz/basalte), via data-board.
   ===================================================================================================== */
:root {
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-brand: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 10px; --r-sm: 6px;
  /* Papier */
  --bg: #f2efe9; --surface: #fdfcfa; --surface-2: #f5f2ec; --border: #e4ded4; --text: #4a443b; --strong: #1f1b16; --muted: #8b8377;
  --accent: #a84f28; --accent-ink: #ffffff; --accent-soft: rgba(168, 79, 40, .10);
  --info: #3e6a8a; --active-move: rgba(62, 106, 138, .14);
  --clock: #f5f2ec; --clock-ink: #4a443b; --clock-run: #1f1b16; --clock-run-ink: #fdfcfa; --clock-low: #a8322a;
  --chart-white: #ffffff; --chart-black: #d9d3c9; --chart-line: #6b645a;
  --j-inacc: #2f80d0; --j-mist: #b87800; --j-blun: #d0302f;
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 6px 20px rgba(40, 30, 20, .06);
  --board-filter: none; --piece-shine: .22;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #141311; --surface: #1e1c19; --surface-2: #262420; --border: #322f2a; --text: #c7c0b4; --strong: #f0ebe3; --muted: #8a8378;
    --accent: #d2743f; --accent-ink: #1b120b; --accent-soft: rgba(210, 116, 63, .14);
    --info: #7fa9c9; --active-move: rgba(127, 169, 201, .18);
    --clock: #262420; --clock-ink: #c7c0b4; --clock-run: #f0ebe3; --clock-run-ink: #141311; --clock-low: #c4453c;
    --chart-white: #d8d2c8; --chart-black: #35322d; --chart-line: #a39c90;
    --j-inacc: #3d8fd9; --j-mist: #c4850c; --j-blun: #e0454a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --board-filter: none; --piece-shine: .2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --surface: #1e1c19; --surface-2: #262420; --border: #322f2a; --text: #c7c0b4; --strong: #f0ebe3; --muted: #8a8378;
  --accent: #d2743f; --accent-ink: #1b120b; --accent-soft: rgba(210, 116, 63, .14);
  --info: #7fa9c9; --active-move: rgba(127, 169, 201, .18);
  --clock: #262420; --clock-ink: #c7c0b4; --clock-run: #f0ebe3; --clock-run-ink: #141311; --clock-low: #c4453c;
  --chart-white: #d8d2c8; --chart-black: #35322d; --chart-line: #a39c90;
  --j-inacc: #3d8fd9; --j-mist: #c4850c; --j-blun: #e0454a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --board-filter: none; --piece-shine: .2;
  color-scheme: dark;
}
/* Veille : pour jouer la nuit — tons ambrés, aucun blanc pur, plateau assombri et réchauffé. */
:root[data-theme="night"] {
  --bg: #0a0807; --surface: #120f0c; --surface-2: #19150f; --border: #262019; --text: #9c8b74; --strong: #c4b08e; --muted: #66594a;
  --accent: #b0703a; --accent-ink: #0a0807; --accent-soft: rgba(176, 112, 58, .14);
  --info: #a58458; --active-move: rgba(176, 112, 58, .16);
  --clock: #19150f; --clock-ink: #9c8b74; --clock-run: #3a2c1c; --clock-run-ink: #d9c29c; --clock-low: #8e3a2e;
  --chart-white: #8c7c64; --chart-black: #221c16; --chart-line: #6d604f;
  --j-inacc: #5a90c8; --j-mist: #bd8726; --j-blun: #d4474c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  --board-filter: brightness(.6) sepia(.35) saturate(.85); --piece-shine: 0;
  color-scheme: dark;
}
/* Plateaux */
:root, :root[data-board="wood"] {
  --b-1: #e6c48e; --b-2: #c7985a; --b-line: #58391b; --b-line-hi: rgba(255, 236, 200, .28); --b-coord: #58391b;
  --hl-last: rgba(255, 206, 84, .55); --hl-sel: rgba(20, 118, 98, .85); --hl-path: rgba(20, 118, 98, .88); --hl-best: rgba(40, 80, 170, .82);
  --hl-shadow: rgba(50, 30, 10, .34); --hl-drag: rgba(50, 30, 10, .4);
}
:root[data-board="granite"] {
  --b-1: #a7a39c; --b-2: #85817a; --b-line: #2c2926; --b-line-hi: rgba(255, 255, 255, .38); --b-coord: #2c2926;
  --hl-last: rgba(255, 200, 90, .55); --hl-sel: rgba(196, 80, 30, .85); --hl-path: rgba(196, 80, 30, .88); --hl-best: rgba(30, 70, 160, .82);
  --hl-shadow: rgba(0, 0, 0, .4); --hl-drag: rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* ---------- En-tête ---------- */
.site { display: flex; align-items: center; gap: 22px; height: 60px; padding: 0 20px; max-width: 1500px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 24px/1 var(--font-brand); color: var(--strong); text-decoration: none; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 30px; color: var(--accent); }
.site nav { display: flex; gap: 2px; }
.site nav button { background: none; border: 0; padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; color: var(--text); }
.site nav button:hover { background: var(--surface-2); color: var(--strong); }
.site .spacer { flex: 1; }
.icon-btn { background: none; border: 0; width: 38px; height: 38px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover, .icon-btn.on { color: var(--strong); background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* Menu Apparence */
.appearance { position: absolute; right: 16px; top: 58px; z-index: 20; width: 300px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: 0 16px 40px rgba(0, 0, 0, .25); }
.appearance h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 2px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); padding: 6px; cursor: pointer; text-align: center;
  font-size: 13px; color: var(--text); }
.tile.on { border-color: var(--accent); color: var(--strong); font-weight: 600; }
.tile .sw { height: 44px; border-radius: 4px; margin-bottom: 6px; position: relative; overflow: hidden; }
.tile .sw.wood { background: repeating-linear-gradient(100deg, rgba(90, 55, 25, .18) 0 2px, transparent 2px 7px), linear-gradient(135deg, #e6c48e, #c7985a); }
.tile .sw.granite { background: radial-gradient(circle at 20% 30%, #3a3733 0 1px, transparent 1.5px) 0 0/7px 9px,
  radial-gradient(circle at 60% 70%, #f1efea 0 1px, transparent 1.5px) 0 0/11px 8px, linear-gradient(135deg, #a7a39c, #85817a); }
.tile .sw::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -22px; border-radius: 50%;
  background: #f4efe4; box-shadow: 22px 0 0 #221d19; }

/* ---------- Disposition principale ---------- */
.round { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(260px, 320px);
  grid-template-areas: "side board table"; gap: 20px; padding: 8px 20px 32px; max-width: 1500px; margin: 0 auto; align-items: start; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.board-col { grid-area: board; display: flex; gap: 8px; min-width: 0; justify-content: center; }
.table { grid-area: table; display: flex; flex-direction: column; min-width: 0; align-self: center; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }

.meta { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.meta .head { display: flex; gap: 12px; align-items: center; }
.meta .head svg { width: 36px; height: 36px; flex: none; color: var(--accent); }
.meta .title { color: var(--strong); font-size: 15px; font-weight: 600; }
.meta .sub { color: var(--muted); font-size: 12.5px; }
.meta .players { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.meta .players > div { display: flex; align-items: center; gap: 9px; color: var(--strong); }
.meta .players small { display: block; color: var(--muted); font-size: 12px; }
.meta .status { border-top: 1px solid var(--border); padding-top: 12px; color: var(--strong); font-weight: 600; }
.meta .status small { display: block; font-weight: 400; color: var(--muted); }

.panel { padding: 14px 18px; }
.panel h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kv div { background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 8px; }
.kv b { display: block; color: var(--strong); font: 600 13px var(--font-mono); }
.kv small { color: var(--muted); font-size: 11px; }
.pv { margin-top: 10px; font: 12px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.toggles { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--border); position: relative; cursor: pointer;
  transition: background .15s; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; width: 16px; height: 16px; top: 2px; left: 2px; border-radius: 50%; background: var(--surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: left .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 16px; }

/* ---------- Plateau ---------- */
.gauge { width: 10px; flex: none; border-radius: 5px; overflow: hidden; background: #2a2622; position: relative; align-self: stretch;
  border: 1px solid var(--border); filter: var(--board-filter); }
.gauge .w { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #f4efe4; transition: height .5s ease; }
.gauge.flip .w { top: 0; bottom: auto; }
.gauge .tick { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--accent); opacity: .9; }
.board-wrap { position: relative; width: min(100%, calc((100vh - 120px) * 920 / 520)); }
svg#board { width: 100%; height: auto; display: block; user-select: none; touch-action: none; border-radius: var(--r);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 14px 34px rgba(0, 0, 0, .18); filter: var(--board-filter); transition: filter .3s; }
.b-frame { fill: none; stroke: rgba(0, 0, 0, .18); stroke-width: 2; }
.ln { stroke: var(--b-line); stroke-width: 3.2; stroke-linecap: round; }
.ln-hi { stroke: var(--b-line-hi); stroke-width: 2.4; stroke-linecap: round; }
.pt { fill: var(--b-line); }
.coord { fill: var(--b-coord); font: 600 16px var(--font-ui); opacity: .7; }
.last { fill: var(--hl-last); }
.selc { fill: var(--hl-sel); }
.dest { fill: var(--hl-sel); }
.cap-ring { fill: none; stroke-width: 6; stroke-dasharray: 9 6; }
.cap-ring.A { stroke: #c2551f; } .cap-ring.W { stroke: #2f6fb0; }
.path { fill: none; stroke: var(--hl-path); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.path.best, .path.hint { stroke: var(--hl-best); stroke-dasharray: 16 10; }
.visited { fill: var(--hl-sel); }
.piece { transition: transform .22s cubic-bezier(.2, .7, .3, 1), opacity .25s ease; pointer-events: none; }
.piece.drag { transition: none; filter: drop-shadow(0 8px 8px var(--hl-drag)); }
.piece.gone { opacity: 0; }
.piece .shadow { fill: var(--hl-shadow); }
.piece .rim-W { fill: none; stroke: rgba(80, 60, 30, .55); stroke-width: 1.6; }
.piece .rim-B { fill: none; stroke: rgba(0, 0, 0, .8); stroke-width: 1.6; }
.piece .inner-W { fill: none; stroke: rgba(150, 125, 85, .35); stroke-width: 1.6; }
.piece .inner-B { fill: none; stroke: rgba(255, 255, 255, .08); stroke-width: 1.6; }
.piece .shine { fill: #fff; opacity: var(--piece-shine); }
.overlay { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
.overlay.top { top: 12px; } .overlay.bottom { bottom: 12px; }
.overlay button { border: 0; border-radius: var(--r-sm); padding: 8px 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); color: #fff; }
.overlay .A { background: #c2551f; } .overlay .W { background: #2f6fb0; } .overlay .stop { background: #2a2622; }
.flash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(20, 17, 14, .86); color: #f0ebe3; padding: 9px 16px;
  border-radius: var(--r-sm); font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 80%; text-align: center; }
.flash.on { opacity: 1; }

/* ---------- Colonne de droite ---------- */
.pline { display: flex; flex-direction: column; }
.clock { align-self: flex-end; font: 600 30px/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 9px 16px;
  background: var(--clock); color: var(--clock-ink); border: 1px solid var(--border); min-width: 140px; text-align: right; transition: background .2s, color .2s; }
.clock.running { background: var(--clock-run); color: var(--clock-run-ink); border-color: var(--clock-run); }
.clock.low.running { background: var(--clock-low); color: #fff; border-color: var(--clock-low); }
.clock.top { border-radius: var(--r) var(--r) 0 0; border-bottom: 0; } .clock.bottom { border-radius: 0 0 var(--r) var(--r); border-top: 0; }
.ruser { display: flex; align-items: center; gap: 9px; padding: 10px 12px; background: var(--surface); min-height: 44px;
  border: 1px solid var(--border); }
.ruser .name { min-width: 0; color: var(--strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ruser .rating { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.ruser .mat { margin-left: auto; color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.ruser .mat b { color: var(--accent); }
.ruser.turn { box-shadow: inset 3px 0 0 var(--accent); }
.pdot { width: 13px; height: 13px; border-radius: 50%; flex: none; border: 1px solid rgba(80, 60, 30, .5); background: #f4efe4; }
.pdot.B { background: #221d19; border-color: #000; }
.ruser.top { border-radius: var(--r) var(--r) 0 0; } .ruser.bottom { border-radius: 0 0 var(--r) var(--r); }
.moves-box { background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.tview { height: 290px; overflow-y: auto; display: grid; grid-template-columns: 40px 1fr 1fr; align-content: start; font: 500 13px/1 var(--font-mono); }
.tview .idx { background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.tview .mv { padding: 8px 6px 8px 10px; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 4px; min-width: 0;
  overflow-wrap: anywhere; line-height: 1.3; }
.tview .mv:hover { background: var(--surface-2); color: var(--strong); }
.tview .mv.active { background: var(--active-move); color: var(--strong); font-weight: 600; box-shadow: inset 2px 0 0 var(--info); }
.tview .mv .ev { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; white-space: nowrap; padding-left: 4px; }
.tview .mv .g { font-weight: 700; white-space: nowrap; }
.g.inacc { color: var(--j-inacc); } .g.mist { color: var(--j-mist); } .g.blun { color: var(--j-blun); }
.tview .result { grid-column: 1 / -1; text-align: center; padding: 12px 6px; border-top: 1px solid var(--border); font-family: var(--font-ui); }
.tview .result b { display: block; font: 600 18px var(--font-brand); color: var(--strong); margin-bottom: 2px; }
.tview .result span { color: var(--muted); font-size: 12.5px; }
.tview .empty { grid-column: 1 / -1; padding: 18px; color: var(--muted); text-align: center; font: italic 13px var(--font-ui); }
.ctrls { display: flex; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; }
.ctrls button { flex: 1; border: 0; background: none; padding: 10px 0; cursor: pointer; color: var(--muted); display: flex;
  align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; }
.ctrls button:hover:not(:disabled) { background: var(--surface-2); color: var(--strong); }
.ctrls button:disabled { opacity: .35; cursor: default; }
.ctrls button svg { width: 18px; height: 18px; }
.ctrls.actions button { font-size: 12.5px; white-space: nowrap; gap: 5px; padding: 10px 4px; }
.ctrls.actions button svg { width: 16px; height: 16px; flex: none; }
.ctrls.actions button.go { color: var(--accent); font-weight: 600; }

/* ---------- Analyse ---------- */
.chart-wrap { position: relative; }
svg.chart { width: 100%; height: auto; display: block; cursor: crosshair; border-radius: var(--r-sm); }
.chart .cw { fill: var(--chart-white); } .chart .cb { fill: var(--chart-black); }
.chart .cl { fill: none; stroke: var(--chart-line); stroke-width: 2; }
.chart .mid { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
.chart .cur { stroke: var(--info); stroke-width: 2; }
.chart .hov { stroke: var(--text); stroke-width: 1; opacity: .6; }
.chart .jd { stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--strong); color: var(--surface); font: 12px var(--font-ui); padding: 4px 8px;
  border-radius: 4px; white-space: nowrap; transform: translate(-50%, -115%); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.summary { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
.summary th { color: var(--muted); font-weight: 500; text-align: right; padding: 4px; white-space: nowrap; }
.summary th:first-child { text-align: left; }
.summary td { text-align: right; padding: 4px; color: var(--strong); font-variant-numeric: tabular-nums; }
.summary td:first-child { text-align: left; color: var(--text); }
.summary tr + tr td { border-top: 1px solid var(--border); }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin: 6px 0 4px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.btn { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 16px; cursor: pointer; background: var(--surface-2); color: var(--strong); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.thinkbar { height: 2px; overflow: hidden; }
.thinkbar i { display: block; height: 100%; width: 0; background: var(--accent); }

/* ---------- Boîte de dialogue ---------- */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text);
  width: min(540px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
dialog::backdrop { background: rgba(10, 8, 6, .55); backdrop-filter: blur(2px); }
.dlg-head { padding: 18px 22px; font: 600 21px var(--font-brand); color: var(--strong); border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; }
.dlg-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 18px; }
.field > label { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 7px; }
.seg { display: flex; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
.seg button { flex: 1; border: 0; background: none; padding: 8px 4px; cursor: pointer; color: var(--text); font-size: 13px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--strong); }

    padding: 6px 16px 24px; gap: 0; }

  .ctrls.nav { grid-area: nav; border-radius: var(--r) var(--r) 0 0; } .ctrls.actions { grid-area: act; border-radius: 0 0 var(--r) var(--r); border-bottom: 1px solid var(--border); }
  .side { margin-top: 14px; }

}

<script>
"use strict";
// =====================================================================================================
// Géométrie et règles locales. sq = y*9 + x, x = a..i, y = rangée 1..5 (cf. CLAUDE.md du dépôt).
// La logique de capture ne sert qu'à l'affichage (animation, historique) : le moteur reste seul juge.
// =====================================================================================================
const W = 9, H = 5, S = 100, M = 60, NS = "http://www.w3.org/2000/svg";
const FILES = "abcdefghi";
const START_FEN = "BBBBBBBBB/BBBBBBBBB/BWBW1BWBW/WWWWWWWWW/WWWWWWWWW w 0 1";
const sqName = s => FILES[s % W] + (Math.floor(s / W) + 1);
const sqOf = n => (n.charCodeAt(0) - 97) + (n.charCodeAt(1) - 49) * W;
const xy = s => [s % W, Math.floor(s / W)];
const inside = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
const sideAt = k => (k % 2 ? "B" : "W");
const other = c => (c === "W" ? "B" : "W");
const colorName = c => (c === "W" ? "Blancs" : "Noirs");

function parseMove(str) {
  const re = /([a-i][1-5])([AW]?)/g;
  let m, sqs = [];
  while ((m = re.exec(str))) sqs.push({ sq: sqOf(m[1]), kind: m[2] });
  return { str, from: sqs[0].sq, steps: sqs.slice(1).map(p => ({ to: p.sq, kind: p.kind })) };
}
function parseFen(fen) {
  const [rows, side] = fen.split(" ");
  const b = new Array(W * H).fill(null);
  rows.split("/").forEach((row, i) => {
    const y = H - 1 - i;
    let x = 0;
    for (const ch of row) { if (/\d/.test(ch)) x += +ch; else { b[y * W + x] = ch; x++; } }
  });
  return { board: b, side };
}
function captureLine(board, from, to, kind) {
  if (!kind) return [];
  const [fx, fy] = xy(from), [tx, ty] = xy(to);
  const dx = tx - fx, dy = ty - fy, mover = board[from] ? board[from].c : null;
  let x, y, sx, sy;
  if (kind === "A") { x = tx + dx; y = ty + dy; sx = dx; sy = dy; } else { x = fx - dx; y = fy - dy; sx = -dx; sy = -dy; }
  const out = [];
  while (inside(x, y)) { const p = board[y * W + x]; if (!p || p.c === mover) break; out.push(y * W + x); x += sx; y += sy; }
  return out;
}
function applyStep(board, from, to, kind) {
  const b = board.slice();
  for (const c of captureLine(board, from, to, kind)) b[c] = null;
  b[to] = b[from]; b[from] = null;
  return b;
}
function applyMove(board, str) {
  const m = parseMove(str);
  let b = board, cur = m.from;
  for (const st of m.steps) { b = applyStep(b, cur, st.to, st.kind); cur = st.to; }
  return b;
}
const sameBoard = (a, b) => a.every((p, i) => (p ? p.c : null) === (b[i] ? b[i].c : null));
const count = (b, c) => b.reduce((n, p) => n + (p && p.c === c ? 1 : 0), 0);

// =====================================================================================================
// État
// =====================================================================================================
const LEVEL_FALLBACK = [1, 2, 3, 4, 5, 6].map(id => ({ id, name: "Niveau " + id, timed: id > 3 }));
let levels = LEVEL_FALLBACK, nets = [];
let cfg = { mode: "computer", color: "W", level: 4, clock: "0", movetime: 1000, net: "", variant: "free", showEval: true, sound: true };
let game = { moves: [], legal: [], status: "ongoing", fen: START_FEN, result: null };
let positions = [];      // positions[k] = plateau après k demi-coups (pièces {id, c}, identifiants stables)
let viewPly = 0;         // demi-coup affiché
let clock = null;        // {W, B, inc} en ms
let analysis = null;     // {evals: [], running, depth}
let liveInfo = null;     // dernière ligne info du moteur pendant la partie
let chosen = null, pendingAW = null, inputView = null, hintMove = null;
let flipped = false, busy = false, epoch = 0, anaEpoch = 0;
let theme = "auto";

const $ = id => document.getElementById(id);
const live = () => viewPly === game.moves.length;
const over = () => !!game.result;

function rebuildPositions() {
  let b = parseFen(START_FEN).board.map((c, i) => (c ? { id: i + 1, c } : null));
  positions = [b];
  for (const m of game.moves) { b = applyMove(b, m); positions.push(b); }
}
const liveBoard = () => positions[game.moves.length];
const shownBoard = () => (chosen ? inputView : anim ? anim.board : positions[viewPly]);

// =====================================================================================================
// Rendu du plateau
// =====================================================================================================
const svg = $("board");
const pieceEls = new Map();
let layers = {};

function pos(s) {
  let [x, y] = xy(s);
  if (flipped) { x = W - 1 - x; y = H - 1 - y; }
  return [M + x * S, M + (H - 1 - y) * S];
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// Textures procédurales (aucune image) : grain du bois, mouchetures du granite, grain des galets.
function boardDefs(defs) {
  const lin = el("linearGradient", { id: "boardGrad", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  el("stop", { offset: "0", style: "stop-color: var(--b-1)" }, lin);
  el("stop", { offset: "1", style: "stop-color: var(--b-2)" }, lin);
  const noise = (id, freq, oct, seed, matrix) => {
    const f = el("filter", { id, x: 0, y: 0, width: "100%", height: "100%" }, defs);
    el("feTurbulence", { type: "fractalNoise", baseFrequency: freq, numOctaves: oct, seed, stitchTiles: "stitch" }, f);
    el("feColorMatrix", { type: "matrix", values: matrix }, f);
    return f;
  };
  // Bois : bruit très étiré horizontalement = veines ; alpha tiré du bruit.
  noise("grain", "0.0045 0.11", 4, 3, "0 0 0 0 .33  0 0 0 0 .2  0 0 0 0 .08  0 0 0 1.6 -.62");
  noise("grainFine", "0.02 0.6", 2, 11, "0 0 0 0 .28  0 0 0 0 .17  0 0 0 0 .07  0 0 0 1.2 -.5");
  // Granite : taches sombres, grains clairs et marbrure lente.
  noise("speckDark", "0.85", 2, 5, "0 0 0 0 .16  0 0 0 0 .15  0 0 0 0 .14  0 0 0 7 -4.1");
  noise("speckLight", "0.7", 2, 17, "0 0 0 0 .97  0 0 0 0 .96  0 0 0 0 .94  0 0 0 7 -4.3");
  noise("mottle", "0.012", 3, 23, "0 0 0 0 .2  0 0 0 0 .19  0 0 0 0 .18  0 0 0 1.4 -.55");
  // Galets : grain fin limité au disque de la pièce.
  const peb = el("filter", { id: "pebble", x: "-5%", y: "-5%", width: "110%", height: "110%" }, defs);
  el("feTurbulence", { type: "fractalNoise", baseFrequency: "1.1", numOctaves: 2, seed: 29, result: "n" }, peb);
  el("feColorMatrix", { in: "n", type: "matrix", values: "0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .45  0 0 0 5 -2.9", result: "s" }, peb);
  el("feComposite", { in: "s", in2: "SourceAlpha", operator: "in" }, peb);
  // Pièces : dégradés radiaux (lumière en haut à gauche).
  const rad = (id, stops) => {
    const g = el("radialGradient", { id, cx: ".38", cy: ".32", r: ".78" }, defs);
    stops.forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
  };
  rad("pW-wood", [["0", "#fffdf7"], [".55", "#efe5d1"], ["1", "#c9b894"]]);
  rad("pB-wood", [["0", "#5b5149"], [".5", "#2b2520"], ["1", "#0d0b09"]]);
  rad("pW-granite", [["0", "#fbfaf7"], [".6", "#e3dfd7"], ["1", "#b9b3a8"]]);
  rad("pB-granite", [["0", "#3f3d3b"], [".5", "#1b1a19"], ["1", "#060606"]]);
}
const boardStyle = () => document.documentElement.dataset.board || "wood";

function buildBoard() {
  svg.innerHTML = "";
  pieceEls.clear();
  const defs = el("defs", {}, svg);
  boardDefs(defs);
  const stone = boardStyle() === "granite";
  el("rect", { x: 0, y: 0, width: 920, height: 520, fill: "url(#boardGrad)" }, svg);
  if (stone) {
    el("rect", { x: 0, y: 0, width: 920, height: 520, filter: "url(#mottle)" }, svg);
    el("rect", { x: 0, y: 0, width: 920, height: 520, filter: "url(#speckDark)", opacity: .75 }, svg);
    el("rect", { x: 0, y: 0, width: 920, height: 520, filter: "url(#speckLight)", opacity: .6 }, svg);
  } else {
    el("rect", { x: 0, y: 0, width: 920, height: 520, filter: "url(#grain)", opacity: .55 }, svg);
    el("rect", { x: 0, y: 0, width: 920, height: 520, filter: "url(#grainFine)", opacity: .35 }, svg);
  }
  el("rect", { x: 1, y: 1, width: 918, height: 518, rx: 10, class: "b-frame" }, svg);
  // Lignes gravées : un reflet clair décalé sous le trait sombre donne l'effet de sillon.
  const hi = el("g", { transform: "translate(1.3 1.6)" }, svg), lines = el("g", {}, svg);
  const seg = (a, b) => {
    const [x1, y1] = pos(a), [x2, y2] = pos(b);
    el("line", { x1, y1, x2, y2, class: "ln-hi" }, hi);
    el("line", { x1, y1, x2, y2, class: "ln" }, lines);
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = y * W + x;
    if (x + 1 < W) seg(s, s + 1);
    if (y + 1 < H) seg(s, s + W);
    if ((x + y) % 2 === 0) {
      if (x + 1 < W && y + 1 < H) seg(s, s + W + 1);
      if (x + 1 < W && y - 1 >= 0) seg(s, s - W + 1);
    }
  }
  for (let s = 0; s < W * H; s++) { const [cx, cy] = pos(s); el("circle", { cx, cy, r: (xy(s)[0] + xy(s)[1]) % 2 ? 4.5 : 6.5, class: "pt" }, lines); }
  const coords = el("g", {}, svg);
  for (let x = 0; x < W; x++) {
    const s = flipped ? (W - 1 - x) : x;
    el("text", { x: M + x * S + 20, y: 511, class: "coord", "text-anchor": "middle" }, coords).textContent = FILES[s];
  }
  for (let y = 0; y < H; y++) {
    const r = flipped ? y + 1 : H - y;
    el("text", { x: 11, y: M + y * S - 20, class: "coord" }, coords).textContent = r;
  }
  layers.under = el("g", {}, svg);
  layers.pieces = el("g", {}, svg);
  layers.over = el("g", { "pointer-events": "none" }, svg);
}
function makePiece(p) {
  const stone = boardStyle() === "granite", g = el("g", { class: "piece" });
  el("ellipse", { cx: 3, cy: 6, rx: 34, ry: 32, class: "shadow" }, g);
  el("circle", { r: 34, fill: `url(#p${p.c}-${stone ? "granite" : "wood"})` }, g);
  if (stone) el("circle", { r: 34, fill: "#000", filter: "url(#pebble)", opacity: p.c === "W" ? .35 : .18 }, g);
  else el("circle", { r: 23, class: "inner-" + p.c }, g);
  el("circle", { r: 34, class: "rim-" + p.c }, g);
  el("ellipse", { cx: -10, cy: -14, rx: 13, ry: 7.5, class: "shine", transform: "rotate(-20 -10 -14)" }, g);
  return g;
}
function drawPath(path, cls) { el("polyline", { points: path.map(s => pos(s).join(",")).join(" "), class: cls }, layers.over); }

function renderBoard() {
  const board = shownBoard();
  const seen = new Set();
  board.forEach((p, s) => {
    if (!p) return;
    seen.add(p.id);
    const [cx, cy] = pos(s);
    let g = pieceEls.get(p.id);
    if (!g) { g = makePiece(p); layers.pieces.appendChild(g); pieceEls.set(p.id, g); }
    if (!(drag && drag.moved && drag.id === p.id)) g.style.transform = `translate(${cx}px, ${cy}px)`;
  });
  for (const [id, g] of pieceEls) if (!seen.has(id)) { pieceEls.delete(id); g.classList.add("gone"); setTimeout(() => g.remove(), 300); }

  layers.under.innerHTML = ""; layers.over.innerHTML = "";
  if (anim) anim.path.forEach(s => hl(s, "last"));
  else if (!chosen && viewPly > 0) {
    const m = parseMove(game.moves[viewPly - 1]);
    [m.from, ...m.steps.map(s => s.to)].forEach(s => hl(s, "last"));
  }
  if (!chosen && !anim) {
    const best = analysis && analysis.evals[viewPly] && analysis.evals[viewPly].best;
    if (best && (over() || !live())) { const m = parseMove(best); drawPath([m.from, ...m.steps.map(s => s.to)], "path best"); }
    else if (hintMove && live()) drawPath(hintMove, "path hint");
  }
  if (chosen) {
    const path = [chosen.from, ...chosen.steps.map(s => s.to)];
    path.slice(0, -1).forEach(s => hl(s, "visited", 12));
    if (path.length > 1) drawPath(path, "path");
    hl(path[path.length - 1], "selc");
    if (pendingAW) {
      for (const k of ["A", "W"]) for (const s of pendingAW.lines[k]) hl(s, "cap-ring " + k, 42, layers.over);

  $("stopBox").classList.toggle("hidden", !(chosen && chosen.steps.length && !pendingAW && exactMove()));
}

// =====================================================================================================
// Saisie : clic ou glisser-déposer, chaîne de captures case par case
// =====================================================================================================
const humanSide = c => cfg.mode === "friend" || (cfg.mode === "computer" && cfg.color === c);
const canInput = () => live() && !over() && !busy && humanSide(sideAt(game.moves.length));

function candidates() {
  return game.legal.map(parseMove).filter(m => m.from === chosen.from &&
    chosen.steps.every((st, i) => m.steps[i] && m.steps[i].to === st.to && m.steps[i].kind === st.kind));
}

  for (const m of candidates()) if (m.steps.length > n) {

    if (!map.has(st.to)) map.set(st.to, new Set());
    map.get(st.to).add(st.kind);
  }
  return map;
}
const exactMove = () => candidates().find(m => m.steps.length === chosen.steps.length);
const curSquare = () => (chosen.steps.length ? chosen.steps[chosen.steps.length - 1].to : chosen.from);

  const kinds = chosen && nextTargets().get(s);
  if (!kinds) return false;
  if (kinds.size > 1) {
    const from = curSquare();
    pendingAW = { to: s, lines: { A: captureLine(inputView, from, s, "A"), W: captureLine(inputView, from, s, "W") } };
    render();
  } else addStep(s, [...kinds][0]);
  return true;
}

  const caps = captureLine(inputView, curSquare(), to, kind).length;

  chosen.steps.push({ to, kind });
  sound(caps ? "capture" : "move");
  const exact = exactMove(), more = nextTargets().size > 0;
  if (exact && !more) return commit(exact);
  render();
}

// Pointeur : sélection à l'appui, déplacement par glisser ou par clic.
let drag = null;
function squareAt(evt) {

  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  let best = -1, bd = 48 * 48;
  for (let s = 0; s < W * H; s++) { const [cx, cy] = pos(s), d = (cx - p.x) ** 2 + (cy - p.y) ** 2; if (d < bd) { bd = d; best = s; } }
  return { sq: best, x: p.x, y: p.y };
}
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (!live()) { flash("Revenez au dernier coup pour jouer (touche Fin)"); return; }
  if (!canInput()) return;
  const { sq } = squareAt(e);
  if (sq < 0) return;
  const board = shownBoard(), p = board[sq];
  let justSelected = false;
  if (pendingAW) { drag = { from: sq, click: true }; return; }
  if ((!chosen || chosen.steps.length === 0) && p && p.c === sideAt(game.moves.length)) {
    if (!chosen || chosen.from !== sq) {
      if (!movable(sq)) {
        flash(game.legal.some(m => /[AW]/.test(m)) ? "Capture obligatoire : cette pièce ne peut pas capturer" : "Cette pièce ne peut pas bouger");
        return;
      }
      select(sq); justSelected = true; render();
    }
  }
  if (chosen && sq === curSquare()) {
    drag = { from: sq, id: shownBoard()[sq].id, moved: false, justSelected, x0: e.clientX, y0: e.clientY };
    svg.setPointerCapture(e.pointerId);
  } else drag = { from: sq, click: true };
});
svg.addEventListener("pointermove", e => {
  if (!drag || drag.click) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  drag.moved = true;
  const g = pieceEls.get(drag.id);
  if (!g) return;
  const { x, y } = squareAt(e);
  g.classList.add("drag");
  g.style.transform = `translate(${x}px, ${y}px) scale(1.08)`;
  layers.pieces.appendChild(g);
});
svg.addEventListener("pointerup", e => {
  const d = drag; drag = null;
  if (!d) return;
  const { sq } = squareAt(e);
  const g = d.id && pieceEls.get(d.id);
  if (g) g.classList.remove("drag");
  if (d.moved) { if (!(sq >= 0 && tryStep(sq))) render(); return; }
  // Clic simple
  if (pendingAW) { for (const k of ["A", "W"]) if (pendingAW.lines[k].includes(sq)) return chooseKind(k); return; }
  if (!chosen) return;
  if (sq === curSquare()) {
    if (chosen.steps.length === 0 && !d.justSelected) return cancelInput();
    if (chosen.steps.length > 0 && exactMove()) return commit(exactMove());

svg.addEventListener("contextmenu", e => { if (chosen) { e.preventDefault(); cancelInput(); } });

async function commit(m) {
  chosen = null; pendingAW = null; inputView = null; hintMove = null;
  await pushMove(m.str, false);
}

// =====================================================================================================
// Déroulement de la partie
// =====================================================================================================
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function applyServerState(st) {
  game.legal = st.legal; game.fen = st.fen; game.status = st.status;
  const fb = parseFen(st.fen).board;
  if (!sameBoard(liveBoard(), fb.map(c => (c ? { c } : null)))) {
    // Ne devrait pas arriver (logique validée contre le moteur) : on se resynchronise sur le moteur.
    console.warn("plateau local différent du moteur, resynchronisation", st.fen);
    positions[game.moves.length] = fb.map((c, i) => (c ? { id: 1000 + i, c } : null));
  }
  if (st.status !== "ongoing" && !game.result) finish(st.status);
}

async function pushMove(str, byEngine) {
  const mover = sideAt(game.moves.length);
  const wasLive = live();
  const before = liveBoard();
  game.moves.push(str);
  positions.push(applyMove(before, str));
  if (wasLive) viewPly = game.moves.length;
  if (clock && game.moves.length > 2) clock[mover] += clock.inc;
  clockMark = performance.now();
  if (!byEngine) sound(count(before, other(mover)) > count(liveBoard(), other(mover)) ? "capture" : "move");
  game.legal = [];
  render();
  const my = ++epoch;
  busy = true;
  try {
    const st = await api("/api/state", { moves: game.moves, variant: cfg.variant });
    if (my !== epoch) return;
    applyServerState(st);
  } catch (e) {
    if (my !== epoch) return;
    game.moves.pop(); positions.pop(); viewPly = Math.min(viewPly, game.moves.length);
    flash(e.message);
    await refresh();
  } finally { if (my === epoch) busy = false; }
  save(); render();
  maybeEngine();
}

async function refresh() {
  const st = await api("/api/state", { moves: game.moves, variant: cfg.variant });
  rebuildPositions();
  applyServerState(st);
  chosen = null; pendingAW = null; inputView = null;
  render();
}

const engineToMove = () => !over() && (cfg.mode === "auto" || (cfg.mode === "computer" && cfg.color !== sideAt(game.moves.length)));

function engineMovetime() {
  const lv = levels.find(l => l.id === cfg.level);
  let t = cfg.mode === "auto" ? cfg.movetime : (lv && !lv.timed ? 50 : cfg.movetime);
  if (clock) { const side = sideAt(game.moves.length); t = Math.min(t, Math.max(100, clock[side] / 25 + clock.inc * 0.7)); }
  return Math.round(t);
}

async function maybeEngine() {
  if (!engineToMove() || busy) return;
  const my = ++epoch;
  busy = true; thinking(true); render();
  const side = sideAt(game.moves.length);
  try {
    const r = await api("/api/go", { moves: game.moves, variant: cfg.variant, movetime: engineMovetime(), net: cfg.net || null,
      level: cfg.mode === "auto" ? 6 : cfg.level });
    if (my !== epoch) return;
    liveInfo = { ...r.info, side };
    thinking(false);
    await animateEngine(r.bestmove);
    if (my !== epoch) return;
    busy = false;
    const before = liveBoard();
    game.moves.push(r.bestmove);
    positions.push(applyMove(before, r.bestmove));
    if (viewPly === game.moves.length - 1) viewPly = game.moves.length;
    if (clock && game.moves.length > 2) clock[side] += clock.inc;
    clockMark = performance.now();
    applyServerState(r.state);
    save();
  } catch (e) {
    if (my === epoch) { busy = false; flash(e.message); }
  } finally { if (my === epoch) thinking(false); }
  if (my !== epoch) return;
  render();
  if (cfg.mode === "auto" && !over()) setTimeout(maybeEngine, 400);
}

let anim = null;           // image intermédiaire pendant l'animation d'un coup du moteur : {board, path}
async function animateEngine(str) {
  if (!live()) return;
  const m = parseMove(str);
  let b = liveBoard(), cur = m.from;
  const path = [m.from];
  for (const st of m.steps) {
    const caps = captureLine(b, cur, st.to, st.kind).length;
    b = applyStep(b, cur, st.to, st.kind);
    cur = st.to; path.push(cur);
    anim = { board: b, path: path.slice() };
    renderBoard();
    sound(caps ? "capture" : "move");
    await new Promise(r => setTimeout(r, 330));
  }
  anim = null;
}

function finish(status, reason) {
  const map = {
    "white wins": ["1-0", "Victoire des Blancs", "Les Noirs n'ont plus de pièce ou plus de coup"],
    "black wins": ["0-1", "Victoire des Noirs", "Les Blancs n'ont plus de pièce ou plus de coup"],
    "draw (no-capture limit)": ["½-½", "Partie nulle", "Limite de coups sans capture"],
    "draw (threefold repetition)": ["½-½", "Partie nulle", "Triple répétition"],
  };
  if (status === "resign") {
    const w = other(reason);
    game.result = { score: w === "W" ? "1-0" : "0-1", text: "Victoire des " + colorName(w), why: "Les " + colorName(reason) + " abandonnent" };
  } else if (status === "time") {
    const w = other(reason);
    game.result = { score: w === "W" ? "1-0" : "0-1", text: "Victoire des " + colorName(w), why: "Temps écoulé pour les " + colorName(reason) };
  } else {
    const [score, text, why] = map[status] || ["*", status, ""];
    game.result = { score, text, why };
  }
  epoch++; busy = false; thinking(false);
  chosen = null; pendingAW = null; inputView = null;
  sound("end");
  save();
}

// =====================================================================================================
// Pendules
// =====================================================================================================
let clockMark = performance.now();
function parseClock(v) { if (v === "0") return null; const [m, i] = v.split("+").map(Number); return { W: m * 60000, B: m * 60000, inc: i * 1000 }; }
setInterval(() => {
  const now = performance.now(), dt = now - clockMark;
  clockMark = now;
  if (!clock || over() || game.moves.length < 2) return renderClocks();
  const side = sideAt(game.moves.length);
  clock[side] -= dt;
  if (clock[side] <= 0) { clock[side] = 0; finish("time", side); render(); return; }
  renderClocks();
}, 100);
function fmtClock(ms) {
  ms = Math.max(0, ms);
  const s = ms / 1000, m = Math.floor(s / 60), r = s - m * 60;
  if (ms < 10000) return `${m}:${r.toFixed(1).padStart(4, "0")}`;
  return `${m}:${String(Math.floor(r)).padStart(2, "0")}`;
}
function renderClocks() {
  const bottom = flipped ? "B" : "W", top = other(bottom);
  for (const [id, c] of [["clockTop", top], ["clockBottom", bottom]]) {
    const e = $(id);
    e.classList.toggle("hidden", !clock);
    if (!clock) continue;
    e.textContent = fmtClock(clock[c]);
    const running = !over() && game.moves.length >= 2 && sideAt(game.moves.length) === c;
    e.classList.toggle("running", running);
    e.classList.toggle("low", clock[c] < 20000);

}

// =====================================================================================================
// Sons (WebAudio, synthétisés : pas de fichiers)
// =====================================================================================================
let actx = null;
function sound(kind) {
  if (!cfg.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const tone = (f, start, dur, vol, type = "triangle") => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + start);
      g.gain.setValueAtTime(vol, t + start); g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
      o.connect(g).connect(actx.destination); o.start(t + start); o.stop(t + start + dur + 0.02);
    };
    if (kind === "move") tone(520, 0, 0.07, 0.18);
    else if (kind === "capture") { tone(300, 0, 0.09, 0.25, "square"); tone(180, 0.03, 0.12, 0.18); }
    else if (kind === "end") { tone(523, 0, 0.18, 0.15); tone(659, 0.16, 0.18, 0.15); tone(784, 0.32, 0.3, 0.15); }
  } catch (e) { /* audio indisponible : sans importance */ }
}

// =====================================================================================================
// Évaluation : barre, chances de gain (même définition que lichess : 2/(1+e^(-k·cp)) − 1, dans [−1, 1])
// =====================================================================================================
const WC_K = 0.004;
const wcOfCp = cp => 2 / (1 + Math.exp(-WC_K * cp)) - 1;
function whiteScore(score, side) {    // score UCI (camp au trait) -> {wc, cp, label} du point de vue des Blancs
  const sg = side === "W" ? 1 : -1;
  if (score.type === "mate") {
    const v = score.value * sg;
    return { wc: v > 0 ? 1 : -1, cp: v > 0 ? 1000 : -1000, label: "#" + (v > 0 ? "" : "-") + Math.abs(v) };
  }
  const cp = score.value * sg;
  return { wc: wcOfCp(cp), cp: Math.max(-1000, Math.min(1000, cp)), label: (cp >= 0 ? "+" : "") + (cp / 100).toFixed(1) };
}
function evalAt(k) {                 // évaluation de l'analyse après k demi-coups, point de vue des Blancs
  const e = analysis && analysis.evals[k];
  if (!e) return null;
  if (!e.score) {
    if (k === game.moves.length && game.result && game.result.score === "½-½") return { wc: 0, cp: 0, label: "½" };
    const loser = sideAt(k);  // plus de coup pour le camp au trait
    return { wc: loser === "W" ? -1 : 1, cp: loser === "W" ? -1000 : 1000, label: loser === "W" ? "0-1" : "1-0" };
  }

}
function judgment(i) {               // appréciation du coup i (1..n), façon lichess
  const a = evalAt(i - 1), b = evalAt(i);
  if (!a || !b) return null;
  const e = analysis.evals[i - 1];
  if (e.best && sameBoard(applyMove(positions[i - 1], e.best), positions[i])) return null;
  const sg = sideAt(i - 1) === "W" ? 1 : -1;
  const loss = sg * (a.wc - b.wc);
  if (loss >= 0.3) return { g: "??", cls: "blun", name: "Gaffe" };
  if (loss >= 0.2) return { g: "?", cls: "mist", name: "Erreur" };
  if (loss >= 0.1) return { g: "?!", cls: "inacc", name: "Imprécision" };
  return null;
}
function renderGauge() {
  let s = null;
  if (analysis && analysis.evals[viewPly]) s = evalAt(viewPly);
  else if (liveInfo && liveInfo.score && live()) s = whiteScore(liveInfo.score, liveInfo.side);
  const show = cfg.showEval || (analysis && analysis.evals.some(Boolean));
  $("gauge").classList.toggle("hidden", !show);
  $("gauge").classList.toggle("flip", flipped);
  $("gaugeW").style.height = ((s ? s.wc : 0) + 1) * 50 + "%";
  $("gauge").title = s ? "Évaluation : " + s.label : "Évaluation";
}

  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  hint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 22V4M5 4h11l-2 4 2 4H5"/></svg>',
  again: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>',
};
function renderActions() {
  const a = $("actions");
  let html;
  if (over()) {
    html = `<button id="aRematch" class="go">${ICON.again}Revanche</button><button id="aNew">${ICON.plus}Nouvelle partie</button>` +
      `<button id="aAnalyse" ${analysis && (analysis.running || analysis.done) ? "disabled" : ""}>${ICON.chart}Analyser</button>`;
  } else {
    const canBack = game.moves.length > 0 && cfg.mode !== "auto";
    html = `<button id="aBack" ${canBack ? "" : "disabled"} title="Reprendre le coup">${ICON.back}Reprendre</button>` +
      `<button id="aHint" ${cfg.mode !== "auto" && canInput() ? "" : "disabled"} title="Indice">${ICON.hint}Indice</button>` +
      `<button id="aResign" ${cfg.mode !== "auto" && game.moves.length ? "" : "disabled"} title="Abandonner">${ICON.flag}Abandonner</button>`;
  }
  if (a.dataset.html !== html) {
    a.innerHTML = html; a.dataset.html = html;
    const on = (id, f) => { const b = $(id); if (b) b.onclick = f; };
    on("aRematch", rematch); on("aNew", openDialog); on("aAnalyse", runAnalysis);
    on("aBack", takeback); on("aHint", hint); on("aResign", resign);
  }
  const n = game.moves.length;
  $("bFirst").disabled = $("bPrev").disabled = viewPly === 0;
  $("bNext").disabled = $("bLast").disabled = viewPly === n;
}

// ---------- Graphique d'analyse ----------
const CW = 600, CH = 150;
function renderAnalysis() {
  const box = $("analysisBox");
  box.classList.toggle("hidden", !analysis);
  if (!analysis) return;
  const n = game.moves.length, evals = analysis.evals;
  const done = evals.filter(Boolean).length;
  $("anaProgress").classList.toggle("hidden", !analysis.running);
  $("anaProgress").firstElementChild.style.width = (done / (n + 1) * 100) + "%";
  $("anaState").textContent = analysis.running ? `${done}/${n + 1}` : `prof. ${analysis.depth}`;

  const c = $("chart");
  c.innerHTML = "";
  const X = k => (n ? k / n * CW : CW / 2), Y = wc => CH / 2 - wc * (CH / 2 - 6);
  el("rect", { x: 0, y: 0, width: CW, height: CH, class: "cb" }, c);
  const pts = [];
  for (let k = 0; k <= n; k++) { const e = evalAt(k); if (e) pts.push([X(k), Y(e.wc), k]); }
  if (pts.length) {
    const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
    el("path", { d: `M${pts[0][0]},${CH} L${line} L${pts[pts.length - 1][0]},${CH} Z`, class: "cw" }, c);
    el("path", { d: "M" + line, class: "cl" }, c);
  }
  el("line", { x1: 0, x2: CW, y1: CH / 2, y2: CH / 2, class: "mid" }, c);
  el("line", { x1: X(viewPly), x2: X(viewPly), y1: 0, y2: CH, class: "cur" }, c);
  const hov = el("line", { x1: -10, x2: -10, y1: 0, y2: CH, class: "hov" }, c);
  const counts = { W: { inacc: 0, mist: 0, blun: 0, loss: 0, n: 0 }, B: { inacc: 0, mist: 0, blun: 0, loss: 0, n: 0 } };
  for (let i = 1; i <= n; i++) {
    const a = evalAt(i - 1), b = evalAt(i);
    if (!a || !b) continue;
    const side = sideAt(i - 1), sg = side === "W" ? 1 : -1;
    counts[side].loss += Math.max(0, sg * (a.cp - b.cp)); counts[side].n++;
    const j = judgment(i);
    if (!j) continue;
    counts[side][j.cls]++;
    el("circle", { cx: X(i), cy: Y(b.wc), r: 5, fill: `var(--j-${j.cls})`, class: "jd" }, c);
  }
  // Survol : réticule + info-bulle ; clic : aller au coup.
  const tip = $("tip");
  const kAt = e => { const r = c.getBoundingClientRect(); return Math.max(0, Math.min(n, Math.round((e.clientX - r.left) / r.width * n))); };
  c.onmousemove = e => {
    const k = kAt(e), ev = evalAt(k), r = c.getBoundingClientRect();
    hov.setAttribute("x1", X(k)); hov.setAttribute("x2", X(k));
    const j = k ? judgment(k) : null;
    const mv = k ? `${Math.ceil(k / 2)}${k % 2 ? "." : "…"} ${game.moves[k - 1]}${j ? " " + j.g : ""}` : "Position initiale";
    tip.textContent = mv + (ev ? " · " + ev.label : "");
    tip.style.left = (X(k) / CW * r.width) + "px";
    tip.style.top = (Y(ev ? ev.wc : 0) / CH * r.height) + "px";
    tip.classList.add("on");
  };
  c.onmouseleave = () => { tip.classList.remove("on"); hov.setAttribute("x1", -10); hov.setAttribute("x2", -10); };
  c.onclick = e => setView(kAt(e));

  const row = (label, key, cls, g) => `<tr><td>${g ? `<span class="g ${cls}">${g}</span> ` : ""}${label}</td><td>${counts.W[key]}</td><td>${counts.B[key]}</td></tr>`;
  const acpl = s => (counts[s].n ? Math.round(counts[s].loss / counts[s].n) : "–");
  $("summary").innerHTML = `<tr><th></th><th><span class="pdot W" style="display:inline-block;vertical-align:middle"></span> Blancs</th><th><span class="pdot B" style="display:inline-block;vertical-align:middle"></span> Noirs</th></tr>` +
    row("Imprécisions", "inacc", "inacc", "?!") + row("Erreurs", "mist", "mist", "?") + row("Gaffes", "blun", "blun", "??") +
    `<tr><td>Perte moyenne (cp)</td><td>${acpl("W")}</td><td>${acpl("B")}</td></tr>`;
}

async function runAnalysis() {
  if (!game.moves.length) return flash("Rien à analyser");
  const n = game.moves.length, my = ++anaEpoch;
  analysis = { evals: new Array(n + 1).fill(null), running: true, done: false, depth: cfg.net ? 6 : 8 };
  render();
  try {
    for (let i = 0; i <= n; i += 8) {
      const plies = [];
      for (let k = i; k <= Math.min(n, i + 7); k++) plies.push(k);
      const r = await api("/api/eval", { moves: game.moves, plies, depth: analysis.depth, net: cfg.net || null, variant: cfg.variant });
      if (my !== anaEpoch) return;
      for (const e of r.evals) analysis.evals[e.ply] = e;
      renderAnalysis(); renderMoves(); renderGauge(); renderBoard();
    }
    analysis.running = false; analysis.done = true;
  } catch (e) {
    if (my !== anaEpoch) return;
    analysis.running = false; flash("Analyse interrompue : " + e.message);
  }
  save(); render();
}

let thinkTimer = null;
function thinking(on) {
  clearInterval(thinkTimer);
  const bar = $("thinkBar");
  bar.style.width = "0";
  if (!on) return;
  const t0 = performance.now(), dur = engineMovetime() + 150;
  thinkTimer = setInterval(() => { bar.style.width = Math.min(100, (performance.now() - t0) / dur * 100) + "%"; }, 50);
}
let flashTimer = null;
function flash(msg) {
  const f = $("flash");
  f.textContent = msg; f.classList.add("on");
  clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove("on"), 2200);
}

function render() {
  renderBoard(); renderUsers(); renderClocks(); renderMoves(); renderActions(); renderMeta(); renderEngine(); renderGauge(); renderAnalysis();
  $("showEval").checked = cfg.showEval;
}

// =====================================================================================================
// Actions
// =====================================================================================================
function setView(k) {
  k = Math.max(0, Math.min(game.moves.length, k));
  if (chosen) { chosen = null; pendingAW = null; inputView = null; }
  viewPly = k;
  render();
}
async function takeback() {
  if (!game.moves.length || over()) return;
  epoch++; busy = false; thinking(false);
  let n = 1;
  if (cfg.mode === "computer") {
    n = 0;
    do { n++; } while (n < game.moves.length && sideAt(game.moves.length - n) !== cfg.color);
    if (sideAt(game.moves.length - n) !== cfg.color) n = game.moves.length;
  }
  game.moves.splice(game.moves.length - n, n);
  viewPly = game.moves.length; hintMove = null; liveInfo = null;
  try { await refresh(); } catch (e) { flash(e.message); }
  save();
  maybeEngine();
}
function resign() {
  if (over() || !game.moves.length) return;
  const loser = cfg.mode === "computer" ? cfg.color : sideAt(game.moves.length);
  finish("resign", loser);
  render();
}
async function hint() {
  if (!canInput()) return;
  const my = ++epoch;
  busy = true; thinking(true); render();
  try {
    const r = await api("/api/go", { moves: game.moves, variant: cfg.variant, movetime: cfg.movetime, net: cfg.net || null, level: 6 });
    if (my !== epoch) return;
    liveInfo = { ...r.info, side: sideAt(game.moves.length) };
    const m = parseMove(r.bestmove);
    hintMove = [m.from, ...m.steps.map(s => s.to)];
    flash("Suggestion : " + r.bestmove);
  } catch (e) { if (my === epoch) flash(e.message); }
  finally { if (my === epoch) { busy = false; thinking(false); } }
  render();
}
function rematch() {
  if (cfg.mode === "computer") cfg.color = other(cfg.color);
  startGame();
}
async function startGame() {
  epoch++; anaEpoch++; busy = false; thinking(false);
  game = { moves: [], legal: [], status: "ongoing", fen: START_FEN, result: null };
  analysis = null; liveInfo = null; hintMove = null; chosen = null; pendingAW = null; inputView = null;
  clock = parseClock(cfg.clock); clockMark = performance.now();
  flipped = cfg.mode === "computer" && cfg.color === "B";
  rebuildPositions(); viewPly = 0;
  buildBoard();
  try { await refresh(); } catch (e) { flash("Serveur injoignable : " + e.message); }
  save(); render();
  maybeEngine();
}

// ---------- Boîte de dialogue ----------
let draft = null;
function openDialog() {
  draft = { ...cfg };
  syncDialog();
  $("dlg").showModal();
}
function syncDialog() {
  for (const b of $("segMode").children) b.classList.toggle("on", b.dataset.v === draft.mode);
  $("segLevel").innerHTML = levels.map(l => `<button data-v="${l.id}" class="${l.id === draft.level ? "on" : ""}">${l.id}</button>`).join("");
  for (const b of $("segLevel").children) b.onclick = () => { draft.level = +b.dataset.v; syncDialog(); };
  $("lvlName").textContent = levelName(draft.level) + (levels.find(l => l.id === draft.level && !l.timed) ? " — le temps de réflexion n'a pas d'effet" : "");
  $("fLevel").classList.toggle("hidden", draft.mode !== "computer");
  $("dClock").value = draft.clock; $("dMovetime").value = String(draft.movetime); $("dNet").value = draft.net; $("dVariant").value = draft.variant;
  $("colorRow").classList.toggle("hidden", draft.mode !== "computer");
  $("startRow").classList.toggle("hidden", draft.mode === "computer");
  $("dlgTitle").textContent = draft.mode === "computer" ? "Jouer contre l'ordinateur" : draft.mode === "friend" ? "Partie à deux" : "Ordinateur contre ordinateur";
}
for (const b of $("segMode").children) b.onclick = () => { draft.mode = b.dataset.v; syncDialog(); };
$("dClock").onchange = e => (draft.clock = e.target.value);
$("dMovetime").onchange = e => (draft.movetime = +e.target.value);
$("dNet").onchange = e => (draft.net = e.target.value);
$("dVariant").onchange = e => (draft.variant = e.target.value);
function launch(color) {
  Object.assign(cfg, draft);
  if (color) cfg.color = color === "R" ? (Math.random() < 0.5 ? "W" : "B") : color;
  $("dlg").close();
  startGame();
}
for (const b of $("colorRow").children) b.onclick = () => launch(b.dataset.c);
$("startBtn").onclick = () => launch(null);
$("dlgClose").onclick = () => $("dlg").close();
$("navNew").onclick = openDialog;
$("navAnalyse").onclick = () => {
  if (over()) { if (!analysis) runAnalysis(); else $("analysisBox").scrollIntoView({ behavior: "smooth" }); }
  else flash("L'analyse est disponible à la fin de la partie");
};

// ---------- Contrôles et raccourcis ----------
$("bFirst").onclick = () => setView(0);
$("bPrev").onclick = () => setView(viewPly - 1);
$("bNext").onclick = () => setView(viewPly + 1);
$("bLast").onclick = () => setView(game.moves.length);
$("bFlip").onclick = () => { flipped = !flipped; buildBoard(); render(); save(); };
$("chooseA").onclick = () => pendingAW && chooseKind("A");
$("chooseW").onclick = () => pendingAW && chooseKind("W");
$("stopChain").onclick = () => chosen && exactMove() && commit(exactMove());
$("showEval").onchange = e => { cfg.showEval = e.target.checked; save(); renderGauge(); };
document.addEventListener("keydown", e => {
  if ($("dlg").open || e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowLeft") { setView(viewPly - 1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { setView(viewPly + 1); e.preventDefault(); }
  else if (e.key === "Home" || e.key === "ArrowUp") { setView(0); e.preventDefault(); }
  else if (e.key === "End" || e.key === "ArrowDown") { setView(game.moves.length); e.preventDefault(); }
  else if (e.key === "Escape" && chosen) cancelInput();
  else if (e.key === "f") $("bFlip").click();
});

const SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>';
const SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const PALETTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4c0-4.5-4-8.2-9-8.2z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15.5" cy="7.5" r="1.2" fill="currentColor"/></svg>';
let boardTheme = "wood", autoNight = false;
const nightHours = () => { const h = new Date().getHours(); return h >= 22 || h < 7; };
function applyTheme() {
  const eff = autoNight && nightHours() ? "night" : theme;
  const root = document.documentElement;
  if (eff === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", eff);
  const boardChanged = root.dataset.board !== boardTheme;
  root.dataset.board = boardTheme;
  $("themeBtn").innerHTML = PALETTE_ICON;
  for (const b of $("segTheme").children) b.classList.toggle("on", b.dataset.v === theme);
  for (const b of $("boardTiles").children) b.classList.toggle("on", b.dataset.v === boardTheme);
  $("autoNight").checked = autoNight;
  if (boardChanged && positions.length) { buildBoard(); render(); }
}
setInterval(applyTheme, 60000);   // bascule Veille automatique à l'heure dite
$("themeBtn").onclick = e => { e.stopPropagation(); $("appearance").classList.toggle("hidden"); $("themeBtn").classList.toggle("on"); };
document.addEventListener("click", e => {
  if (!$("appearance").contains(e.target) && e.target !== $("themeBtn")) { $("appearance").classList.add("hidden"); $("themeBtn").classList.remove("on"); }
});
for (const b of $("segTheme").children) b.onclick = () => { theme = b.dataset.v; applyTheme(); save(); };
for (const b of $("boardTiles").children) b.onclick = () => { boardTheme = b.dataset.v; applyTheme(); save(); };
$("autoNight").onchange = e => { autoNight = e.target.checked; applyTheme(); save(); };
function applySoundBtn() { $("soundBtn").innerHTML = cfg.sound ? SOUND_ON : SOUND_OFF; $("soundBtn").title = cfg.sound ? "Sons activés" : "Sons coupés"; }
$("soundBtn").onclick = () => { cfg.sound = !cfg.sound; applySoundBtn(); save(); if (cfg.sound) sound("move"); };

// ---------- Persistance (confort local uniquement) ----------
function save() {
  try {
    localStorage.setItem("fanorona-gui-v2", JSON.stringify({ cfg, theme, boardTheme, autoNight, flipped, moves: game.moves, result: game.result, clock,
      analysis: analysis && !analysis.running ? analysis : null }));
  } catch (e) { /* stockage indisponible */ }
}
function load() {
  try { return JSON.parse(localStorage.getItem("fanorona-gui-v2")); } catch (e) { return null; }
}

(async function init() {
  try {
    const c = await api("/api/config");
    nets = c.nets || [];
    for (const n of nets) { const o = document.createElement("option"); o.value = n; o.textContent = "NNUE " + n; $("dNet").appendChild(o); }
    if (c.levels) levels = c.levels;
    cfg.net = c.defaultNet || "";
  } catch (e) { flash("Serveur injoignable : " + e.message); }
  const saved = load();
  if (saved) {
    Object.assign(cfg, saved.cfg || {});
    if (cfg.net && !nets.includes(cfg.net)) cfg.net = "";
    theme = saved.theme || "auto";
    boardTheme = saved.boardTheme || "wood";
    autoNight = !!saved.autoNight;
  }
  applyTheme(); applySoundBtn();
  if (saved && Array.isArray(saved.moves) && saved.moves.length) {
    game.moves = saved.moves; game.result = saved.result || null; clock = saved.clock || null;
    analysis = saved.analysis || null; flipped = !!saved.flipped;
    rebuildPositions(); viewPly = game.moves.length;
    buildBoard();
    try {
      const st = await api("/api/state", { moves: game.moves, variant: cfg.variant });
      applyServerState(st);
      render(); maybeEngine();
      return;
    } catch (e) { game.moves = []; game.result = null; analysis = null; }
  }
  await startGame();
  if (!saved) openDialog();
})();
</script>
